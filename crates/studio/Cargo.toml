[package]
name = "shredini-studio"
version = "0.5.0"
edition = "2024"
license = "MIT"

[dependencies]
shredini-core = { package = "shredini-audio-core", path = "../core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midly = { version = "0.5", default-features = false, features = ["std"] }
tempfile = "3"
ringbuf = "0.4"
