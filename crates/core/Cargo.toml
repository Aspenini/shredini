[package]
name = "shredini-audio-core"
version = "0.5.0"
edition = "2024"
license = "MIT"

[features]
asio = []

[dependencies]
anyhow = "1"
biquad = "0.5"
ringbuf = "0.4"
rustysynth = "1.3"
symphonia = { version = "0.5", features = ["mp3", "flac", "vorbis", "wav", "ogg", "pcm"] }
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
midir = "0.11"
hound = "3.5"
tempfile = "3"
