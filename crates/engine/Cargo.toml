[package]
name = "shredini-engine"
version = "0.5.0"
edition = "2024"
license = "MIT"

[features]
asio = ["cpal/asio", "shredini-core/asio"]

[dependencies]
shredini-core = { package = "shredini-audio-core", path = "../core" }
anyhow = "1"
cpal = { version = "=0.18.2", features = ["realtime"] }
midir = "0.11"
ringbuf = "0.4"
rubato = { version = "5", default-features = false }
rustysynth = "1.3"
clack-host = "0.2"
clack-extensions = { version = "0.2", features = ["clack-host", "audio-ports"] }

[dev-dependencies]
clack-plugin = "0.2"
clack-host = { version = "0.2", features = ["clack-plugin"] }
clack-extensions = { version = "0.2", features = ["clack-plugin"] }
