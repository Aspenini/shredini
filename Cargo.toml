[workspace]
members = ["crates/core", "crates/engine", "crates/studio"]
resolver = "3"

[package]
name = "shredini"
version = "0.5.0"
edition = "2024"
license = "MIT"
description = "A native workspace for playing, recording and producing music"

[features]
default = ["studio"]
studio = ["dep:shredini-studio"]
asio = ["shredini-engine/asio"]

[lib]
name = "shredini_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
ringbuf = "0.4"
rustysynth = "1.3"
shredini-audio-core = { path = "crates/core" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = "1"
directories = "6"
gpui = "=0.2.1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shredini-engine = { path = "crates/engine" }
shredini-studio = { path = "crates/studio", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# GPUI's archived tar implementation still uses libc's Linux ENOATTR alias.
libc = "=0.2.189"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
